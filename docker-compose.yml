version: "3.9"

services:
  lsg-status:
    build: .
    container_name: lsg-status
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

# Si se desea desplegar junto a la stack principal de LSG (gateway, auth,
# core-api, db, cache), conectar esta red a la red externa del compose
# principal en lugar de levantar este servicio de forma aislada:
#
# networks:
#   default:
#     external: true
#     name: lsg_default
